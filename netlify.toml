# Build command runs ONLY `next build` (postinstall handles `prisma generate`).
# It does NOT touch the database — the DB was initialized via supabase/init.sql.
# Make sure the Netlify UI build command is empty (or "npm run build") so this file is used.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # NEXT_PUBLIC_* values are intentionally inlined into the client bundle.
  # Tell Netlify's secret scanner to ignore this non-secret public key.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_APP_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"
